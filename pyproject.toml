[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounty-core"
version = "0.1.0"
description = "Shared bug bounty storage, ledger, report, and index helpers for Ghost tooling."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["bounty_core"]
